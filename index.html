<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>テッペンとリーヨ！ ── テストプレイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/fx.css">
</head>
<body>

<!-- 盤面。1440x810 を基準に組み、画面サイズに合わせて全体を拡大縮小する -->
<div id="stage" class="stage" hidden>

  <svg class="stage__lines" viewBox="0 0 1440 810" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="var(--line)" stroke-width="2" opacity=".2">
      <rect x="16" y="60" width="1408" height="734"/>
      <line x1="16" y1="427" x2="1424" y2="427"/>
      <circle cx="720" cy="427" r="118"/>
      <circle cx="720" cy="427" r="5" fill="var(--line)" stroke="none"/>
      <rect x="470" y="60" width="500" height="118"/>
      <rect x="610" y="60" width="220" height="46"/>
      <rect x="470" y="676" width="500" height="118"/>
      <rect x="610" y="748" width="220" height="46"/>
      <path d="M563 178 A118 118 0 0 0 877 178"/>
      <path d="M563 676 A118 118 0 0 1 877 676"/>
    </g>
  </svg>

  <header class="hud">
    <div class="hud__brand"><span aria-hidden="true">⚡</span>テッペンとリーヨ！</div>
    <div class="hud__scores" id="scores"></div>
    <nav class="hud__tools">
      <a class="tool" id="btnRules" href="あそびかた.html" target="_blank" rel="noopener">あそびかた</a>
      <button type="button" class="tool" id="btnLog" aria-pressed="false">記録</button>
      <button type="button" class="tool" id="btnMenu">設定</button>
    </nav>
  </header>

  <section class="bench bench--them" id="opponents" aria-label="相手"></section>

  <section class="fieldrow" aria-label="場">
    <div class="fieldrow__label">場<small>コイン1枚で拾える</small></div>
    <div class="piles" id="piles"></div>
    <div class="counters" id="counters"></div>
  </section>

  <section class="bench bench--me" id="mybench" aria-label="自分の選手"></section>

  <section class="handrow" aria-label="手札">
    <div class="handrow__side" id="handSide"></div>
    <div class="hand" id="hand"></div>
  </section>

  <div class="banner" id="banner" hidden></div>
</div>

<!-- 演出 -->
<div class="fx" id="fx" aria-hidden="true"></div>

<!-- 選択パネル（リアクション・場の山を開く・拡大） -->
<div class="chooser" id="chooser" hidden>
  <div class="chooser__panel" role="dialog" aria-modal="true" aria-labelledby="chooserTitle">
    <div class="chooser__head">
      <h2 class="chooser__title" id="chooserTitle"></h2>
      <p class="chooser__sub" id="chooserSub"></p>
    </div>
    <div class="chooser__body">
      <div class="chooser__incoming" id="chooserIncoming"></div>
      <div class="chooser__cards" id="chooserCards"></div>
    </div>
    <div class="chooser__foot" id="chooserFoot"></div>
  </div>
</div>

<!-- 記録（補助） -->
<aside class="logpane" id="logpane" hidden>
  <div class="logpane__head">記録<button type="button" class="logpane__close" id="btnLogClose">閉じる</button></div>
  <ol class="logpane__list" id="logList"></ol>
</aside>

<!-- 設定 / 開始 -->
<dialog class="sheet" id="setup">
  <div class="sheet__inner">
    <h1 class="sheet__title"><span>テッペンと</span><em>リーヨ！</em></h1>
    <p class="sheet__lead">紙のカードゲームのテストプレイ用。数値はここで全部いじれます。</p>

    <div class="sheet__cols">
      <div>
        <fieldset class="grp">
          <legend>人数</legend>
          <div class="seg" id="segPlayers" role="radiogroup" aria-label="人数"></div>
          <label class="row"><span>あなたも参加する</span><input type="checkbox" id="optHuman" checked></label>
        </fieldset>

        <fieldset class="grp">
          <legend>あなたのキャプテン（円堂守）</legend>
          <div class="capgrid" id="capGrid"></div>
        </fieldset>
      </div>

      <div>
        <fieldset class="grp">
          <legend>カードの数</legend>
          <label class="num"><span>収録するキャラ</span>
            <select id="optRoster">
              <option value="v2" selected>18人（推奨）</option>
              <option value="v2b">21人（木戸川の三兄弟あり）</option>
              <option value="full">24人（全員）</option>
            </select><i></i></label>
          <label class="num"><span>初期手札</span><input type="number" id="optHand" min="3" max="24" value="14"><i>枚</i></label>
          <label class="num"><span>勝利に必要な点</span><input type="number" id="optWin" min="1" max="9" value="3"><i>点</i></label>
          <label class="num"><span>必殺カードの複製数</span><input type="number" id="optTech" min="1" max="6" value="2"><i>枚ずつ</i></label>
          <label class="num"><span>キャラカードの複製数</span><input type="number" id="optChar" min="1" max="6" value="3"><i>枚ずつ</i></label>
          <p class="grp__note" id="deckNote"></p>
        </fieldset>

        <fieldset class="grp">
          <legend>イナズマコイン（トークン）</legend>
          <label class="num"><span>開始時に配る</span><input type="number" id="optCoinStart" min="0" max="20" value="5"><i>個</i></label>
          <label class="num"><span>リアクション成功で</span><input type="number" id="optCoinReact" min="0" max="10" value="2"><i>個</i></label>
          <label class="num"><span>連続成功のたび追加で</span><input type="number" id="optCoinStreak" min="0" max="5" value="1"><i>個ずつ</i></label>
          <label class="num"><span>失点で</span><input type="number" id="optCoinConcede" min="0" max="10" value="1"><i>個</i></label>
          <label class="num"><span>手番Aで</span><input type="number" id="optCoinPlay" min="0" max="5" value="0"><i>個</i></label>
          <label class="num"><span>持てる上限</span><input type="number" id="optCoinCap" min="1" max="40" value="12"><i>個</i></label>
          <label class="num"><span>演出の速さ</span>
            <select id="optSpeed">
              <option value="1">じっくり</option>
              <option value="0.55" selected>ふつう</option>
              <option value="0.3">はやい</option>
              <option value="0">なし（数値だけ見る）</option>
            </select><i></i></label>
        </fieldset>
      </div>
    </div>

    <div class="sheet__actions">
      <button type="button" class="btn btn--go" id="btnStart">キックオフ</button>
      <button type="button" class="btn btn--sub" id="btnSim">CPU同士で回す</button>
      <a class="btn btn--sub" href="あそびかた.html" target="_blank" rel="noopener">あそびかたを読む</a>
    </div>
  </div>
</dialog>

<!-- 一括対戦 -->
<dialog class="sheet" id="simdlg">
  <div class="sheet__inner">
    <h1 class="sheet__title"><em>CPU一括対戦</em></h1>
    <p class="sheet__lead">いまの設定のまま、CPUだけで回して統計を取ります。</p>
    <label class="num"><span>試合数</span><input type="number" id="simN" min="10" max="3000" step="10" value="300"><i>試合</i></label>
    <div class="sheet__actions">
      <button type="button" class="btn btn--go" id="btnSimRun">回す</button>
      <button type="button" class="btn btn--sub" id="btnSimClose">戻る</button>
    </div>
    <div class="simprog" id="simProg" hidden><div class="simprog__bar" id="simProgBar"></div></div>
    <div class="simout" id="simOut"></div>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
